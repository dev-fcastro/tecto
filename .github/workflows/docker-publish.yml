name: Docker

on:
  push:
    branches: [master]
    tags: ['v*.*.*']

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/odimsom/tecto
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: server.synsetsolutions.com
          username: synset_server
          password: ${{ secrets.DEPLOY_SSH_PASS }}
          script: |
            cd /opt/synset/lab
            docker login ghcr.io -u odimsom -p ${{ secrets.GITHUB_TOKEN }} || true
            docker compose pull tecto
            docker compose up -d --force-recreate tecto

  release:
    needs: build-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          body_prefix: |
            ## Imagen Docker

            Usa esta versión específica:
            ```
            docker pull ghcr.io/odimsom/tecto:${{ github.ref_name }}
            ```
            O la última estable:
            ```
            docker pull ghcr.io/odimsom/tecto:latest
            ```
