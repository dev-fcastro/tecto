services:

  tecto:
    image: ghcr.io/dev-fcastro/tecto:latest
    pull_policy: always
    volumes:
      - tecto_pdfs:/app/pdfs
      - tecto_assets:/app/assets
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synset_admin:xWdiVJl7y1eJJhcO6S%2FAqfgz1QvPznGs@synset-postgres:5432/tecto
    networks: [dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.tecto.rule=Host(`tecto.server.synsetsolutions.com`)"
      - traefik.http.routers.tecto.entrypoints=websecure
      - traefik.http.routers.tecto.tls.certresolver=le
      - traefik.http.services.tecto.loadbalancer.server.port=8080


networks:
  dokploy-network:
    external: true

volumes:
  tecto_pdfs:
  tecto_assets:
