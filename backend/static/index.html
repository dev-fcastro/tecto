<style>
/* ── Tecto Design Tokens ─────────────────────────────────────────────────── */
:root {
  --accent:#c75b12;--accent-hover:#a84a0e;--accent-active:#8f3f0c;
  --accent-subtle-bg:#fbefe3;--accent-subtle-fg:#9a4410;--accent-on:#fff;
  --accent-ring:rgba(199,91,18,.32);
  --paper:#fff;--bg:#faf9f7;--bg-subtle:#f3f1ed;
  --surface:#fff;--surface-raised:#fff;--surface-sunken:#f6f4f0;--surface-hover:#f3f1ed;
  --border:#e8e4de;--border-strong:#d8d1c8;--border-accent:#e9b489;
  --ink-strong:#1c1a17;--ink:#2e2a26;--ink-muted:#6b635b;--ink-subtle:#9a9087;
  --success:#1f8a4c;--success-fg:#156b3a;--success-bg:#e7f4ec;
  --danger:#c8372d;--danger-fg:#a12a22;--danger-bg:#fbeae8;
  --warning:#b7791f;--warning-bg:#fbf1de;
  --code-bg:#fbfaf8;--code-gutter:#b8afa4;--code-cmd:#c75b12;
  --code-math:#1f8a4c;--code-comment:#9a9087;--code-text:#2e2a26;
  --font-serif:'IBM Plex Serif',Georgia,serif;
  --font-sans:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius-sm:4px;--radius-md:6px;--radius-lg:10px;--radius-xl:14px;--radius-full:9999px;
  --shadow-sm:0 1px 3px rgba(28,26,23,.08);
  --shadow-md:0 3px 8px rgba(28,26,23,.1);
  --shadow-lg:0 8px 24px rgba(28,26,23,.12);
  --shadow-xl:0 16px 48px rgba(28,26,23,.16);
  --topbar-h:52px;--rail-w:48px;--statusbar-h:28px;
}
.dark {
  --accent:#ef7a2a;--accent-hover:#f2873d;--accent-subtle-bg:#2c1d12;--accent-subtle-fg:#f3a062;--accent-on:#1a1714;
  --paper:#fff;--bg:#1a1714;--bg-subtle:#161310;
  --surface:#221e1a;--surface-raised:#292420;--surface-sunken:#161310;--surface-hover:#2b2620;
  --border:#36302a;--border-strong:#4a4239;--border-accent:#6e4a2b;
  --ink-strong:#f6f3ef;--ink:#e7e2db;--ink-muted:#a79d92;--ink-subtle:#7c7268;
  --success:#36b56a;--success-fg:#7fd6a3;--success-bg:#16271d;
  --danger:#e35a4f;--danger-fg:#f0a39c;--danger-bg:#2a1714;
  --warning:#d9a23a;--warning-bg:#271d10;
  --code-bg:#1d1916;--code-gutter:#6a6056;--code-cmd:#ef9b5e;--code-math:#4fc585;--code-comment:#7c7268;--code-text:#e7e2db;
}

/* ── Reset & base ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden}
body{font-family:var(--font-sans);font-size:14px;background:var(--bg);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
a{color:inherit;text-decoration:none}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.app{height:100%;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.topbar__spacer{flex:1}
.body{flex:1;min-height:0;display:flex}
.rail{width:var(--rail-w);flex:none;background:var(--surface-sunken);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.split{flex:1;min-height:0;display:flex}
.editor-pane{flex:1.1;min-width:0;border-right:1px solid var(--border);display:flex;flex-direction:column}
.preview-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-sunken)}
.statusbar{height:var(--statusbar-h);display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--surface-sunken);border-top:1px solid var(--border);font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);flex:none}
.statusbar__sp{flex:1}

/* ── Library panel ───────────────────────────────────────────────────────── */
.lib-panel{display:none;flex-direction:column;height:100%;background:var(--surface)}
.lib-panel.active{display:flex}
.lib-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.lib-title{font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--ink-strong)}
.lib-list{flex:1;overflow-y:auto;padding:8px}
.lib-empty{padding:32px 16px;text-align:center;color:var(--ink-subtle);font-size:13px}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-md);cursor:pointer;
  border:1px solid transparent;transition:background .12s}
.doc-row:hover{background:var(--surface-hover)}
.doc-row.active{background:var(--accent-subtle-bg);border-color:var(--border-accent)}
.doc-row__icon{color:var(--ink-muted);flex:none}
.doc-row__name{font-size:13px;font-weight:500;color:var(--ink-strong);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-row__engine{font-family:var(--font-mono);font-size:10px;color:var(--ink-subtle)}
.doc-row__del{opacity:0;color:var(--ink-subtle);padding:2px 4px;border-radius:3px;background:transparent;transition:opacity .1s}
.doc-row:hover .doc-row__del{opacity:1}
.doc-row__del:hover{color:var(--danger);background:var(--danger-bg)}

/* ── History panel ───────────────────────────────────────────────────────── */
.hist-panel{display:none;flex-direction:column;height:100%;background:var(--surface)}
.hist-panel.active{display:flex}
.hist-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border);font-size:13px}
.hist-status{font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:var(--radius-full);font-weight:500}
.hist-status.ok{background:var(--success-bg);color:var(--success-fg)}
.hist-status.err{background:var(--danger-bg);color:var(--danger-fg)}
.hist-time{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-left:auto}

/* ── Log panel ───────────────────────────────────────────────────────────── */
.log-panel{display:none;flex-direction:column;background:var(--code-bg);height:100%}
.log-panel.active{display:flex}
.log-content{flex:1;overflow-y:auto;padding:14px;font-family:var(--font-mono);font-size:12px;
  color:var(--code-text);line-height:1.6;white-space:pre-wrap;word-break:break-all}
.log-error-line{color:var(--danger)}

/* ── Monaco editor wrapper ───────────────────────────────────────────────── */
#monaco-container{flex:1;min-height:0}
.editor-toolbar{height:36px;display:flex;align-items:center;padding:0 12px;gap:8px;
  border-bottom:1px solid var(--border);background:var(--surface);flex:none}
.editor-toolbar__name{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);flex:1}
.engine-sel{font-family:var(--font-mono);font-size:12px;padding:3px 8px;
  border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);
  color:var(--ink);outline:none;cursor:pointer}
.engine-sel:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}

/* ── PDF preview ─────────────────────────────────────────────────────────── */
.preview-toolbar{height:36px;display:flex;align-items:center;padding:0 12px;gap:8px;
  border-bottom:1px solid var(--border);background:var(--surface-sunken);flex:none}
.preview-stage{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;
  padding:24px;background:var(--bg-subtle)}
.pdf-iframe{width:100%;max-width:700px;height:100%;min-height:600px;
  border:none;border-radius:var(--radius-sm);box-shadow:var(--shadow-xl);background:var(--paper)}
.preview-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--ink-subtle);font-size:13px;gap:10px}
.preview-placeholder svg{opacity:.3}

/* ── Compile states ──────────────────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;
  padding:2px 8px;border-radius:var(--radius-full);font-weight:500}
.pill.idle{background:var(--bg-subtle);color:var(--ink-muted)}
.pill.running{background:var(--warning-bg);color:var(--warning)}
.pill.success{background:var(--success-bg);color:var(--success-fg)}
.pill.error{background:var(--danger-bg);color:var(--danger-fg)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.idle{background:var(--ink-subtle)}
.dot.running{background:var(--warning);animation:pulse .8s infinite}
.dot.success{background:var(--success)}
.dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;
  border-radius:var(--radius-md);font-size:13px;font-weight:500;transition:background .12s,color .12s,box-shadow .12s;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:active{background:var(--accent-active)}
.btn-primary:disabled{opacity:.45;pointer-events:none}
.btn-ghost{background:transparent;color:var(--ink-muted);border-color:transparent}
.btn-ghost:hover{background:var(--surface-hover);color:var(--ink)}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:var(--radius-md)}
.rail-btn{width:38px;height:38px;border-radius:var(--radius-md);background:transparent;
  color:var(--ink-muted);display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;position:relative}
.rail-btn:hover{background:var(--surface-hover);color:var(--ink)}
.rail-btn.active{background:var(--accent-subtle-bg);color:var(--accent-subtle-fg)}
.rail-btn.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;
  width:3px;border-radius:3px;background:var(--accent)}

/* ── Logo ────────────────────────────────────────────────────────────────── */
.logo{display:inline-flex;align-items:center;gap:9px}
.logo-mark{width:26px;height:26px;border-radius:7px}
.logo-word{font-family:var(--font-serif);font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--ink-strong)}

/* ── Crumb ───────────────────────────────────────────────────────────────── */
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-muted)}
.crumb b{color:var(--ink-strong);font-weight:600;font-family:var(--font-mono);font-size:13px}

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{padding:10px 16px;border-radius:var(--radius-lg);font-size:13px;min-width:260px;max-width:380px;
  display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow-lg);
  animation:slide-in .18s ease-out}
.toast.success{background:var(--success-bg);color:var(--success-fg);border:1px solid var(--success)}
.toast.error{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger)}
.toast-title{font-weight:600;font-size:13px}
.toast-msg{font-size:12px;margin-top:2px;font-family:var(--font-mono);opacity:.85}
@keyframes slide-in{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── New doc modal ───────────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);
  box-shadow:var(--shadow-xl);padding:24px;width:380px}
.modal-title{font-family:var(--font-serif);font-size:17px;font-weight:600;color:var(--ink-strong);margin-bottom:16px}
.input{height:36px;padding:0 10px;border-radius:var(--radius-md);border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:13px;outline:none;width:100%}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ── Theme toggle ────────────────────────────────────────────────────────── */
.theme-toggle{font-size:16px;line-height:1}
</style>
</head>

<script>

// ── Default LaTeX template ──────────────────────────────────────────────────
const DEFAULT_TEX = `\\documentclass[12pt]{article}
\\usepackage[utf8]{inputenc}
\\usepackage[T1]{fontenc}
\\usepackage{amsmath,amssymb}
\\usepackage{geometry}
\\geometry{margin=2.5cm}

\\title{Mi Documento}
\\author{Autor}
\\date{\\today}

\\begin{document}
\\maketitle

\\section{Introducción}
Escribe aquí tu contenido. Tecto usa \\textbf{Tectonic} como motor,
así que no hay que pelear con TeX Live.

\\section{Fórmulas}
La identidad de Euler:
\\begin{equation}
  e^{i\\pi} + 1 = 0
\\end{equation}

\\section{Lista de ítems}
\\begin{itemize}
  \\item Primer ítem
  \\item Segundo ítem
  \\item Tercer ítem
\\end{itemize}

\\end{document}`;

// ── Tecto App ───────────────────────────────────────────────────────────────
function App() {
  const [theme, setTheme] = useState(() => localStorage.getItem('tecto-theme') || 'light');
  const [view, setView] = useState('editor'); // editor|library|history|settings
  const [docs, setDocs] = useState([]);
  const [currentDoc, setCurrentDoc] = useState(null);
  const [tex, setTex] = useState(DEFAULT_TEX);
  const [engine, setEngine] = useState('XeLaTeX');
  const [status, setStatus] = useState('idle'); // idle|running|success|error
  const [compileMs, setCompileMs] = useState(null);
  const [pdfUrl, setPdfUrl] = useState(null);
  const [log, setLog] = useState('');
  const [history, setHistory] = useState([]);
  const [toasts, setToasts] = useState([]);
  const [showNewDoc, setShowNewDoc] = useState(false);
  const [newDocName, setNewDocName] = useState('');
  const monacoRef = useRef(null);
  const editorRef = useRef(null);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('tecto-theme', theme);
  }, [theme]);

  useEffect(() => { loadDocs(); }, []);

  const loadDocs = async () => {
    const r = await fetch('/docs');
    if (r.ok) setDocs(await r.json());
  };

  const openDoc = async (doc) => {
    const r = await fetch(`/docs/${doc.id}`);
    if (!r.ok) return;
    const d = await r.json();
    setCurrentDoc(d);
    setTex(d.tex);
    setEngine(d.engine);
    setStatus('idle');
    setPdfUrl(null);
    setLog('');
    setView('editor');
    if (editorRef.current) editorRef.current.setValue(d.tex);
    // load history
    const hr = await fetch(`/history/${doc.id}`);
    if (hr.ok) setHistory(await hr.json());
  };

  const saveDoc = async (newTex, newEngine) => {
    if (!currentDoc) return;
    await fetch(`/docs/${currentDoc.id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },

    const docId = currentDoc?.id ?? 'draft-' + Math.random().toString(36).slice(2);

    setPdfUrl(null);

        method: 'POST',

        body: JSON.stringify({ id: docId, tex: currentTex, engine }),

      const data = await r.json();
      setCompileMs(data.ms);
      if (data.ok) {

        setPdfUrl(data.pdf_url + '?t=' + Date.now());

          if (hr.ok) setHistory(await hr.json());

                  currentDoc ? 'Sin compilaciones aún.' : 'Abre un documento para ver su historial.')
              : history.map(run =>
                  React.createElement('div', { key:run.id, className:'hist-row' },

                      run.status==='success' ? 'OK' : 'Error'),

                      `${run.pdf_size_kb} KB`),

                )
          ),

          // Settings view
          React.createElement('div', { style:{display:view==='settings'?'flex':'none',flexDirection:'column',padding:24,gap:20} },
            React.createElement('div', {style:{fontFamily:'var(--font-serif)',fontSize:18,fontWeight:600,color:'var(--ink-strong)'}}, 'Ajustes'),
            React.createElement('div', {style:{display:'flex',flexDirection:'column',gap:8}},
              React.createElement('label', {style:{fontSize:13,color:'var(--ink-muted)',fontFamily:'var(--font-mono)',letterSpacing:'.04em'}},
                'MOTOR PREDETERMINADO'),
              React.createElement('select', {className:'engine-sel',style:{width:200},value:engine,onChange:e=>setEngine(e.target.value)},
                ['pdfLaTeX','XeLaTeX','LuaLaTeX'].map(e=>React.createElement('option',{key:e,value:e},e)))
            ),

                'TEMA'),

                ['light','dark'].map(t=>

                    t==='light'?'Claro':'Oscuro'))
              )
            ),

              'shell-escape — desactivado por defecto. Necesario para minted/TikZ externos. Riesgo si es público.')

          // Status bar
          React.createElement('div', { className:'statusbar' },

        )

    // Toasts

            React.createElement('div',{className:'toast-title'},t.title),
            React.createElement('div',{className:'toast-msg'},t.msg)
          )
        )
      )
    ),

    // New doc modal

      React.createElement('div', { className:'modal', onClick:e=>e.stopPropagation() },
        React.createElement('div', {className:'modal-title'}, 'Nuevo documento'),
        React.createElement('input', {className:'input', placeholder:'paper-2026.tex', value:newDocName,
          onChange:e=>setNewDocName(e.target.value),
          onKeyDown:e=>{if(e.key==='Enter')createDoc();if(e.key==='Escape')setShowNewDoc(false)},

        React.createElement('div', {className:'modal-actions'},
          React.createElement('button',{className:'btn btn-ghost',onClick:()=>setShowNewDoc(false)},'Cancelar'),
          React.createElement('button',{className:'btn btn-primary',onClick:createDoc},'Crear')
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
